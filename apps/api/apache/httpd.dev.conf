ServerRoot "/usr/local/apache2"
Listen 80

# Modules nécessaires
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so

User daemon
Group daemon

# Types MIME supplémentaires pour les assets
<IfModule mod_mime.c>
    AddType application/javascript .js
    AddType text/css .css
    AddType image/svg+xml .svg
    AddType font/woff .woff
    AddType font/woff2 .woff2
    AddType font/ttf .ttf
    AddType application/x-font-opentype .otf
</IfModule>

DocumentRoot "/app/apps/api/public"
<Directory "/app/apps/api/public">
    AllowOverride All
    Require all granted
    Options Indexes FollowSymLinks
    DirectoryIndex index.php index.html
</Directory>

<VirtualHost *:80>
    ServerName localhost
    ProxyRequests Off
    ProxyPreserveHost On

    # Servir les bundles directement sans proxifier
    Alias /bundles/ "/app/apps/api/public/bundles/"
    <Directory "/app/apps/api/public/bundles/">
        Require all granted
        # Désactiver les rewrites pour les fichiers statiques
        RewriteEngine Off
    </Directory>

    # Ne pas proxifier les bundles statiques
    ProxyPass /bundles/ !
    ProxyPass /.well-known/ !

    # rediriger les .php vers le php-fpm du service api-dev
    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://api-dev:9000/app/apps/api/public/$1

    <Directory "/app/apps/api/public">
        RewriteEngine On
        RewriteBase /
        # Ne pas rewriter les fichiers/répertoires existants
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        # Rewriter vers index.php pour les URLs dynamiques
        RewriteRule ^(.*)$ index.php [QSA,L,PT]
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>